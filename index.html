<style>
  :root {
    --primary: #4f46e5;
    --primary-light: #eef2ff;
    --primary-mid: #c7d2fe;
    --green: #16a34a;
    --green-light: #f0fdf4;
    --orange: #d97706;
    --orange-light: #fffbeb;
    --red: #dc2626;
    --red-light: #fef2f2;
    --bg: #f8f7ff;
    --surface: #ffffff;
    --border: #e2e1f0;
    --text: #1e1b4b;
    --text-muted: #6b7280;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── SCREENS ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── TOPBAR ── */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1.25rem;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 32px; height: 32px; border-radius: 9px;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 18px; height: 18px; fill: white; }
  .logo-name { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
  .logo-name span { color: var(--primary); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .user-chip {
    font-size: 12px; color: var(--text-muted);
    background: var(--bg); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 20px;
  }
  .btn-back {
    background: none; border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 5px 12px;
    font-size: 13px; color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  .btn-back:hover { background: var(--bg); }
  .topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }

  /* ── CONTENT WRAPPER ── */
  .content { max-width: 680px; margin: 0 auto; padding: 1.5rem 1.25rem; }

  /* ── AUTH SCREEN ── */
  .auth-wrap {
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .auth-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 2.5rem 2rem;
    max-width: 400px; width: 100%; text-align: center;
  }
  .auth-logo { margin-bottom: 1.5rem; }
  .auth-logo .logo-icon { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 12px; }
  .auth-logo .logo-icon svg { width: 30px; height: 30px; }
  .auth-logo h1 { font-size: 26px; font-weight: 700; letter-spacing: -1px; }
  .auth-logo h1 span { color: var(--primary); }
  .auth-logo p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
  .auth-tabs { display: flex; gap: 4px; background: var(--bg); border-radius: var(--radius-sm); padding: 4px; margin: 1.5rem 0 1.25rem; }
  .auth-tab {
    flex: 1; padding: 8px; border: none; border-radius: 6px;
    font-size: 14px; cursor: pointer; background: none; color: var(--text-muted);
  }
  .auth-tab.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .auth-form { display: flex; flex-direction: column; gap: 10px; }
  .auth-form input {
    width: 100%; padding: 11px 14px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-size: 14px;
    background: var(--bg); color: var(--text); outline: none;
  }
  .auth-form input:focus { border-color: var(--primary); background: white; }
  .btn-auth {
    width: 100%; padding: 12px; background: var(--primary);
    color: white; border: none; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  .btn-auth:hover { background: #4338ca; }
  .auth-msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .auth-msg.error { color: var(--red); }
  .auth-msg.success { color: var(--green); }

  /* ── HOME SCREEN ── */
  .home-header { margin-bottom: 1.5rem; }
  .home-header h2 { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .home-header p { font-size: 14px; color: var(--text-muted); }
  .section-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 10px;
  }
  .list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .list-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem;
    cursor: pointer; transition: all 0.15s;
  }
  .list-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(79,70,229,0.1); }
  .list-card-badge {
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 20px;
    display: inline-block; margin-bottom: 8px;
  }
  .list-card h3 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .list-card p { font-size: 12px; color: var(--text-muted); }
  .list-card .prog-mini { margin-top: 8px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .list-card .prog-mini-fill { height: 100%; background: var(--primary); border-radius: 2px; }

  /* ── SETS SCREEN ── */
  .prog-wrap { margin-bottom: 1.5rem; }
  .prog-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .prog-meta strong { color: var(--text); }
  .prog-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.5s ease; }
  .sets-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .set-btn {
    aspect-ratio: 1; border-radius: var(--radius-sm);
    border: 1px solid var(--border); font-size: 13px; font-weight: 600;
    cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    background: var(--surface); transition: all 0.15s;
  }
  .set-btn.unlocked:hover { border-color: var(--primary); color: var(--primary); }
  .set-btn.locked { background: var(--bg); color: var(--text-muted); cursor: not-allowed; opacity: 0.55; }
  .set-btn.completed { background: var(--primary-light); border-color: var(--primary-mid); color: var(--primary); }
  .set-btn .dots { display: flex; gap: 2px; margin-top: 2px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; }

  /* ── LEARN SCREEN ── */
  .word-hero { text-align: center; padding: 1.5rem 0 1rem; }
  .word-hero .word-big { font-size: 36px; font-weight: 800; color: var(--text); letter-spacing: -1.5px; margin-bottom: 6px; }
  .word-hero .word-meta { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .word-pos-badge { font-size: 11px; background: var(--primary-light); color: var(--primary); padding: 3px 8px; border-radius: 20px; font-weight: 600; }
  .word-phonetic { font-size: 13px; color: var(--text-muted); font-style: italic; }
  .word-number { font-size: 12px; color: var(--text-muted); background: var(--bg); padding: 3px 8px; border-radius: 20px; border: 1px solid var(--border); }

  .tabs-wrap { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 1rem; }
  .tab-btn {
    padding: 6px 13px; border-radius: 20px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border); background: none; cursor: pointer;
    color: var(--text-muted); transition: all 0.12s;
  }
  .tab-btn:hover { border-color: var(--primary-mid); color: var(--primary); }
  .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  .content-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.25rem;
    min-height: 130px; margin-bottom: 1rem;
    font-size: 14px; line-height: 1.75; color: var(--text);
  }
  .content-card .card-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 10px;
  }
  .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .word-tag {
    padding: 4px 12px; border-radius: 20px; font-size: 12px;
    border: 1px solid var(--border); color: var(--text-muted);
  }
  .word-tag.syn { background: var(--primary-light); color: var(--primary); border-color: var(--primary-mid); }
  .word-tag.ant { background: var(--red-light); color: var(--red); border-color: #fca5a5; }

  .mark-section { padding-top: 1rem; border-top: 1px solid var(--border); }
  .mark-prompt { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 10px; font-weight: 500; }
  .mark-btns { display: flex; gap: 8px; }
  .mark-btn {
    flex: 1; padding: 11px 0; border-radius: var(--radius-sm);
    border: 1.5px solid; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.15s; background: none;
  }
  .mark-btn.g { border-color: var(--green); color: var(--green); }
  .mark-btn.g:hover { background: var(--green-light); }
  .mark-btn.o { border-color: var(--orange); color: var(--orange); }
  .mark-btn.o:hover { background: var(--orange-light); }
  .mark-btn.r { border-color: var(--red); color: var(--red); }
  .mark-btn.r:hover { background: var(--red-light); }
  .mark-btn.selected-g { background: var(--green-light); }
  .mark-btn.selected-o { background: var(--orange-light); }
  .mark-btn.selected-r { background: var(--red-light); }

  /* ── QUIZ SCREEN ── */
  .quiz-header { margin-bottom: 1rem; }
  .quiz-pips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .pip {
    width: 32px; height: 32px; border-radius: 50%; font-size: 11px;
    font-weight: 700; display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--border); color: var(--text-muted); background: var(--bg);
  }
  .pip.c { background: var(--green-light); border-color: #86efac; color: var(--green); }
  .pip.w { background: var(--red-light); border-color: #fca5a5; color: var(--red); }
  .pip.done { background: var(--primary-light); border-color: var(--primary-mid); color: var(--primary); }

  .quiz-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 2rem 1.5rem;
    text-align: center; margin-bottom: 1.25rem;
  }
  .quiz-word { font-size: 32px; font-weight: 800; letter-spacing: -1px; color: var(--text); margin-bottom: 6px; }
  .quiz-instruction { font-size: 13px; color: var(--text-muted); }

  .quiz-opts { display: flex; flex-direction: column; gap: 8px; }
  .quiz-opt {
    padding: 13px 16px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--border); background: var(--surface);
    font-size: 14px; cursor: pointer; text-align: left;
    color: var(--text); transition: all 0.12s; line-height: 1.5;
  }
  .quiz-opt:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
  .quiz-opt.correct { background: var(--green-light); border-color: #86efac; color: var(--green); }
  .quiz-opt.wrong { background: var(--red-light); border-color: #fca5a5; color: var(--red); }
  .quiz-opt:disabled { cursor: not-allowed; }

  /* ── COMPLETE SCREEN ── */
  .complete-wrap {
    min-height: calc(100vh - 56px);
    display: flex; align-items: center; justify-content: center;
    padding: 2rem;
  }
  .complete-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 2.5rem 2rem;
    max-width: 420px; width: 100%; text-align: center;
  }
  .complete-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--primary-light); margin: 0 auto 1.25rem;
    display: flex; align-items: center; justify-content: center;
  }
  .complete-icon svg { width: 32px; height: 32px; }
  .complete-title { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
  .complete-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 1.5rem; }
  .stats-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 1.5rem; }
  .stat-chip {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 16px; text-align: center;
  }
  .stat-chip strong { display: block; font-size: 22px; font-weight: 800; }
  .stat-chip span { font-size: 11px; color: var(--text-muted); }
  .stat-chip.g strong { color: var(--green); }
  .stat-chip.o strong { color: var(--orange); }
  .stat-chip.r strong { color: var(--red); }
  .btn-primary {
    display: inline-block; background: var(--primary); color: white;
    border: none; padding: 12px 28px; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn-primary:hover { background: #4338ca; }
  .btn-secondary {
    display: inline-block; background: none; color: var(--text-muted);
    border: 1px solid var(--border); padding: 10px 20px;
    border-radius: var(--radius-sm); font-size: 14px; cursor: pointer; margin-left: 8px;
  }
  .btn-secondary:hover { background: var(--bg); }

  /* ── LOADING ── */
  .loader {
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 12px;
  }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader p { font-size: 14px; color: var(--text-muted); }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    background: #1e1b4b; color: white; padding: 10px 20px;
    border-radius: 20px; font-size: 13px; font-weight: 500;
    z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 480px) {
    .sets-grid { grid-template-columns: repeat(4, 1fr); }
    .list-grid { grid-template-columns: repeat(2, 1fr); }
    .mark-btn { font-size: 11px; }
  }
</style>
</head>
<body>

  <p>Vocabuzz লোড হচ্ছে...</p>

          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <h1>Vocab<span>uzz</span></h1>
        <p>শব্দ শিখুন, পরীক্ষায় এগিয়ে থাকুন</p>
      </div>

        <button class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</button>

<div id="s-home" class="screen">
  <div class="topbar">
    <div class="logo-wrap">
      <div class="logo-icon">

<!-- SETS -->

    <span class="topbar-title" id="sets-title"></span>
    <div class="topbar-right">
      <span class="user-chip" id="sets-badge"></span>
    </div>
  </div>
  <div class="content">
    <div class="prog-wrap">
      <div class="prog-meta">
        <span><strong id="p-done">0</strong> sets সম্পন্ন</span>
        <span id="p-pct" style="font-weight:600;color:var(--primary)">0%</span>

  <div class="content">

<!-- QUIZ -->
<div id="s-quiz" class="screen">
  <div class="topbar">

      <span class="user-chip" id="quiz-prog"></span>
    </div>
  </div>

    <div class="quiz-card">

  </div>
</div>

<!-- COMPLETE -->
<div id="s-complete" class="screen">
  <div class="topbar">
    <button class="btn-back" onclick="go('s-sets')">← Sets</button>
    <span class="topbar-title">সেট সম্পন্ন</span>
  </div>
  <div class="complete-wrap">
    <div class="complete-card">
      <div class="complete-icon">
        <svg fill="none" stroke="#4f46e5" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <div class="complete-title" id="comp-title">সেট সম্পন্ন!</div>
      <div class="complete-sub" id="comp-sub">সবগুলো শব্দে ২টি সঠিক উত্তর দিয়েছেন</div>
      <div class="stats-row">
        <div class="stat-chip g"><strong id="c-green">0</strong><span>কনফিডেন্ট</span></div>
        <div class="stat-chip o"><strong id="c-orange">0</strong><span>হাফ</span></div>
        <div class="stat-chip r"><strong id="c-red">0</strong><span>চিন্তিত</span></div>
      </div>
      <button class="btn-primary" id="comp-next">পরের সেটে যান →</button>
      <button class="btn-secondary" onclick="go('s-home')">Home</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// SUPABASE INIT
// ═══════════════════════════════════════════════
const SUPA_URL = 'https://gfdnkpjjqtifstlgvdzw.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmZG5rcGpqcXRpZnN0bGd2ZHp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NTIyMDIsImV4cCI6MjA5MzMyODIwMn0.K-1f9RKXbYYZHDNvwVpYCBs11JfJ1K3xkVHuFR-P1JU';
let SESSION_TOKEN = localStorage.getItem('vb_token') || null;

// Native fetch — কোনো SDK/CDN লাগবে না
const supa = {
  async signUp(email, password) {
    const r = await fetch(`${SUPA_URL}/auth/v1/signup`, {
      method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
      body: JSON.stringify({email, password})
    });
    return r.json();
  },
  async signIn(email, password) {
    const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
      method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
      body: JSON.stringify({email, password})
    });
    const data = await r.json();
    if (data.access_token) {
      SESSION_TOKEN = data.access_token;
      localStorage.setItem('vb_token', SESSION_TOKEN);
      return { user: data.user, error: null };
    }
    return { user: null, error: { message: data.error_description || data.msg || 'Login failed' } };
  },
  async getUser() {
    if (!SESSION_TOKEN) return null;
    try {
      const r = await fetch(`${SUPA_URL}/auth/v1/user`, {
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SESSION_TOKEN}
      });
      if (!r.ok) { SESSION_TOKEN = null; localStorage.removeItem('vb_token'); return null; }
      return r.json();
    } catch(e) { return null; }
  },
  signOut() {
    SESSION_TOKEN = null;
    localStorage.removeItem('vb_token');
  },
  async loadProgress(userId) {
    try {
      const r = await fetch(`${SUPA_URL}/rest/v1/progress?user_id=eq.${userId}&select=*`, {
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SESSION_TOKEN}
      });
      if (!r.ok) return [];
      return r.json();
    } catch(e) { return []; }
  },
  async saveProgress(userId, listId, setNum, completed, marks) {
    try {
      await fetch(`${SUPA_URL}/rest/v1/progress`, {
        method:'POST',
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SESSION_TOKEN,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
        body: JSON.stringify({user_id:userId,list_id:listId,set_number:setNum,completed,marks,updated_at:new Date().toISOString()})
      });
    } catch(e) { console.error('Save failed',e); }
  }
};

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let STATE = {
  user: null,
  listId: null,
  currentSet: null,
  wordIdx: 0,
  activeTab: 0,
  marks: {},           // { word: 'green'|'orange'|'red' }
  completedSets: {},   // { 'listId-setNum': true }
  savedMarks: {},      // { 'listId-setNum': {word: color} }
  quizCorrect: {},     // { word: count }
};

const TABS = ['সংজ্ঞা', 'বিস্তারিত', 'Synonyms', 'Antonyms', 'উদাহরণ', 'বাংলা'];

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function getSetKey(listId, setNum) { return listId + '-' + setNum; }

// ═══════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════
let authMode = 'login';

function switchAuthTab(mode) {
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach((t, i) => {
    t.classList.toggle('active', (mode === 'login' && i === 0) || (mode === 'signup' && i === 1));
  });
  document.getElementById('auth-btn').textContent = mode === 'login' ? 'Login করুন' : 'Sign Up করুন';
  document.getElementById('auth-msg').textContent = '';
}

async function handleAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-password').value;
  const msg = document.getElementById('auth-msg');
  msg.className = 'auth-msg';
  if (!email || !pass) { msg.className='auth-msg error'; msg.textContent='ইমেইল ও পাসওয়ার্ড দিন'; return; }
  document.getElementById('auth-btn').textContent = '...';

  if (authMode === 'login') {
    const result = await supa.signIn(email, pass);
    if (result.error) {
      msg.className='auth-msg error'; msg.textContent=result.error.message;
      document.getElementById('auth-btn').textContent='Login করুন';
    } else {
      STATE.user = result.user;
      await loadProgress(STATE.user.id);
      renderHome(); go('s-home');
    }
  } else {
    const data = await supa.signUp(email, pass);
    if (data.error) {
      msg.className='auth-msg error'; msg.textContent=data.error.message||'Error';
      document.getElementById('auth-btn').textContent='Sign Up করুন';
    } else {
      msg.className='auth-msg success'; msg.textContent='Account তৈরি হয়েছে! এখন Login করুন।';
      document.getElementById('auth-btn').textContent='Sign Up করুন';
      switchAuthTab('login');
    }
  }
}

async function handleLogout() {
  supa.signOut();
  STATE.user = null; STATE.completedSets = {}; STATE.savedMarks = {};
  go('s-auth');
}

// ═══════════════════════════════════════════════
// LOAD & SAVE PROGRESS
// ═══════════════════════════════════════════════
async function loadProgress(userId) {
  const data = await supa.loadProgress(userId);
  STATE.completedSets = {}; STATE.savedMarks = {};
  (data||[]).forEach(row => {
    const key = getSetKey(row.list_id, row.set_number);
    if (row.completed) STATE.completedSets[key] = true;
    if (row.marks) STATE.savedMarks[key] = row.marks;
  });
}

async function saveProgress(listId, setNum, completed, marks) {
  if (!STATE.user) return;
  await supa.saveProgress(STATE.user.id, listId, setNum, completed, marks);
  const key = getSetKey(listId, setNum);
  if (completed) STATE.completedSets[key] = true;
  STATE.savedMarks[key] = marks;
}

// ═══════════════════════════════════════════════
// HOME
// ═══════════════════════════════════════════════
function renderHome() {
  document.getElementById('user-email-chip').textContent = STATE.user.email.split('@')[0];
  const grid = document.getElementById('list-grid');
  grid.innerHTML = Object.entries(WORD_DATA).map(([id, list]) => {
    const totalSets = list.sets.length;
    const doneSets = Object.keys(STATE.completedSets).filter(k => k.startsWith(id + '-')).length;
    const pct = totalSets > 0 ? Math.round(doneSets / totalSets * 100) : 0;
    return `
      <div class="list-card" onclick="openList('${id}')">
        <span class="list-card-badge" style="background:${list.color}22;color:${list.color};">${list.totalWords} words</span>
        <h3>${list.name}</h3>
        <p>${list.sets.length} sets available</p>
        <div class="prog-mini">
          <div class="prog-mini-fill" style="width:${pct}%;background:${list.color}"></div>
        </div>
      </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════
// SETS
// ═══════════════════════════════════════════════
function openList(id) {
  STATE.listId = id;
  const list = WORD_DATA[id];
  document.getElementById('sets-title').textContent = list.name;
  document.getElementById('sets-badge').textContent = list.totalWords + ' words';
  renderSets();
  updateProgress();
  go('s-sets');
}

function renderSets() {
  const list = WORD_DATA[STATE.listId];
  const grid = document.getElementById('sets-grid');
  grid.innerHTML = list.sets.map((set, i) => {
    const n = set.setNumber;
    const key = getSetKey(STATE.listId, n);
    const done = !!STATE.completedSets[key];
    const prevKey = getSetKey(STATE.listId, n - 1);
    const unlocked = n === 1 || !!STATE.completedSets[prevKey];
    const cls = done ? 'completed' : unlocked ? 'unlocked' : 'locked';

    const marks = STATE.savedMarks[key] || {};
    const g = Object.values(marks).filter(m => m === 'green').length;
    const o = Object.values(marks).filter(m => m === 'orange').length;
    const r = Object.values(marks).filter(m => m === 'red').length;

    const dotsHtml = done ? `<div class="dots">
      ${g > 0 ? `<div class="dot" style="background:var(--green)"></div>` : ''}
      ${o > 0 ? `<div class="dot" style="background:var(--orange)"></div>` : ''}
      ${r > 0 ? `<div class="dot" style="background:var(--red)"></div>` : ''}
    </div>` : cls === 'locked' ? '<span style="font-size:12px;">🔒</span>' : '';

    const onclick = cls !== 'locked' ? `onclick="openSet(${n})"` : '';
    return `<button class="set-btn ${cls}" ${onclick}><span>Set ${n}</span>${dotsHtml}</button>`;
  }).join('');
}

function updateProgress() {
  const list = WORD_DATA[STATE.listId];
  const total = list.sets.length;
  const done = Object.keys(STATE.completedSets).filter(k => k.startsWith(STATE.listId + '-')).length;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('p-done').textContent = done;
  document.getElementById('p-pct').textContent = pct + '%';
  document.getElementById('p-fill').style.width = pct + '%';
}

// ═══════════════════════════════════════════════
// LEARN
// ═══════════════════════════════════════════════
function openSet(setNum) {
  STATE.currentSet = setNum;
  STATE.wordIdx = 0;
  STATE.activeTab = 0;
  STATE.marks = {};
  const key = getSetKey(STATE.listId, setNum);
  // Pre-fill marks if revisiting
  if (STATE.savedMarks[key]) STATE.marks = { ...STATE.savedMarks[key] };

  document.getElementById('learn-title').textContent = 'Set ' + setNum;
  document.getElementById('learn-back-btn').onclick = () => {
    renderSets(); updateProgress(); go('s-sets');
  };
  renderWord();
  go('s-learn');
}

function getWords() {
  const list = WORD_DATA[STATE.listId];
  const set = list.sets.find(s => s.setNumber === STATE.currentSet);
  return set ? set.words : [];
}

function renderWord() {
  const words = getWords();
  const w = words[STATE.wordIdx];
  if (!w) return;
  document.getElementById('w-word').textContent = w.w;
  document.getElementById('w-pos').textContent = w.pos;
  document.getElementById('w-ph').textContent = w.ph;
  document.getElementById('w-num').textContent = (STATE.wordIdx + 1) + ' / ' + words.length;
  document.getElementById('learn-prog').textContent = (STATE.wordIdx + 1) + '/' + words.length;
  renderTabs(w);
  updateMarkButtons(w.w);
}

function renderTabs(w) {
  const tabsEl = document.getElementById('word-tabs');
  tabsEl.innerHTML = TABS.map((t, i) =>
    `<button class="tab-btn ${i === STATE.activeTab ? 'active' : ''}" onclick="switchTab(${i})">${t}</button>`
  ).join('');
  renderContent(w);
}

function switchTab(i) {
  STATE.activeTab = i;
  const w = getWords()[STATE.wordIdx];
  document.querySelectorAll('.tab-btn').forEach((t, j) => t.classList.toggle('active', j === i));
  renderContent(w);
}

function renderContent(w) {
  const box = document.getElementById('word-content');
  const i = STATE.activeTab;
  if (i === 0) box.innerHTML = `<div class="card-label">সংজ্ঞা</div><div>${w.def}</div>`;
  else if (i === 1) box.innerHTML = `<div class="card-label">Advanced Definition</div><div>${w.adv}</div>`;
  else if (i === 2) box.innerHTML = `<div class="card-label">Synonyms</div><div class="tag-cloud">${w.syn.map(s => `<span class="word-tag syn">${s}</span>`).join('')}</div>`;
  else if (i === 3) box.innerHTML = `<div class="card-label">Antonyms</div><div class="tag-cloud">${w.ant.map(s => `<span class="word-tag ant">${s}</span>`).join('')}</div>`;
  else if (i === 4) box.innerHTML = `<div class="card-label">Example Sentence</div><div style="font-style:italic;color:var(--text-muted)">"${w.example}"</div>`;
  else box.innerHTML = `<div class="card-label">বাংলা উদাহরণ</div><div>${w.bangla}</div>`;
}

function updateMarkButtons(wordName) {
  const m = STATE.marks[wordName];
  ['g', 'o', 'r'].forEach(c => document.getElementById('mb-' + c).className = 'mark-btn ' + c);
  if (m === 'green') document.getElementById('mb-g').classList.add('selected-g');
  else if (m === 'orange') document.getElementById('mb-o').classList.add('selected-o');
  else if (m === 'red') document.getElementById('mb-r').classList.add('selected-r');
}

function markWord(color) {
  const words = getWords();
  const w = words[STATE.wordIdx];
  STATE.marks[w.w] = color;
  updateMarkButtons(w.w);
  // Auto-save marks (non-completed)
  saveProgress(STATE.listId, STATE.currentSet, false, STATE.marks);

  setTimeout(() => {
    if (STATE.wordIdx < words.length - 1) {
      STATE.wordIdx++;
      STATE.activeTab = 0;
      renderWord();
    } else {
      showToast('সব শব্দ পড়া হয়েছে! এখন Quiz শুরু হবে');
      setTimeout(startQuiz, 800);
    }
  }, 200);
}

// ═══════════════════════════════════════════════
// QUIZ
// ═══════════════════════════════════════════════
function startQuiz() {
  STATE.quizCorrect = {};
  const words = getWords();
  words.forEach(w => { STATE.quizCorrect[w.w] = 0; });
  document.getElementById('quiz-title').textContent = 'Set ' + STATE.currentSet + ' Quiz';
  go('s-quiz');
  renderQuiz();
}

function renderQuiz() {
  const words = getWords();
  const pending = words.filter(w => (STATE.quizCorrect[w.w] || 0) < 2);
  if (pending.length === 0) { endSet(); return; }

  const total = words.length * 2;
  const done = Object.values(STATE.quizCorrect).reduce((a, b) => a + b, 0);
  document.getElementById('quiz-prog').textContent = done + ' / ' + total;

  // Pips
  const pipsEl = document.getElementById('quiz-pips');
  pipsEl.innerHTML = words.map(w => {
    const c = STATE.quizCorrect[w.w] || 0;
    const cls = c >= 2 ? 'done' : c === 1 ? 'c' : '';
    return `<div class="pip ${cls}">${c >= 2 ? '✓' : c === 1 ? '1' : '?'}</div>`;
  }).join('');

  const w = pending[Math.floor(Math.random() * pending.length)];
  document.getElementById('q-word').textContent = w.w;

  const allDefs = words.map(x => x.def);
  const wrong = allDefs.filter(d => d !== w.def).sort(() => Math.random() - 0.5).slice(0, 3);
  const opts = [...wrong, w.def].sort(() => Math.random() - 0.5);

  const optsEl = document.getElementById('q-opts');
  optsEl.innerHTML = opts.map(o => {
    const esc = o.replace(/"/g, '&quot;');
    return `<button class="quiz-opt" data-def="${esc}" data-word="${w.w}" data-correct="${w.def.replace(/"/g, '&quot;')}" onclick="answerQuiz(this)">${o}</button>`;
  }).join('');
}

function answerQuiz(btn) {
  document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
  const chosen = btn.getAttribute('data-def');
  const correct = btn.getAttribute('data-correct');
  const word = btn.getAttribute('data-word');

  if (chosen === correct) {
    btn.classList.add('correct');
    STATE.quizCorrect[word] = (STATE.quizCorrect[word] || 0) + 1;
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.quiz-opt').forEach(b => {
      if (b.getAttribute('data-def') === correct) b.classList.add('correct');
    });
  }
  setTimeout(renderQuiz, 1000);
}

// ═══════════════════════════════════════════════
// COMPLETE
// ═══════════════════════════════════════════════
async function endSet() {
  const g = Object.values(STATE.marks).filter(m => m === 'green').length;
  const o = Object.values(STATE.marks).filter(m => m === 'orange').length;
  const r = Object.values(STATE.marks).filter(m => m === 'red').length;

  // Save completed to Supabase
  await saveProgress(STATE.listId, STATE.currentSet, true, STATE.marks);
  showToast('Progress Supabase এ save হয়েছে!');

  document.getElementById('comp-title').textContent = 'Set ' + STATE.currentSet + ' সম্পন্ন! 🎉';
  document.getElementById('comp-sub').textContent = 'সব শব্দে ২টি সঠিক উত্তর দিয়েছেন';
  document.getElementById('c-green').textContent = g;
  document.getElementById('c-orange').textContent = o;
  document.getElementById('c-red').textContent = r;

  const list = WORD_DATA[STATE.listId];
  const nextSet = list.sets.find(s => s.setNumber === STATE.currentSet + 1);
  const nextBtn = document.getElementById('comp-next');
  if (nextSet) {
    nextBtn.textContent = 'পরের সেটে যান →';
    nextBtn.onclick = () => openSet(STATE.currentSet + 1);
  } else {
    nextBtn.textContent = 'সব সেট শেষ! Home এ যান';
    nextBtn.onclick = () => { renderHome(); go('s-home'); };
  }
  renderSets();
  updateProgress();
  go('s-complete');
}

async function init() {
  const user = await supa.getUser();
  if (user && user.id) {
    STATE.user = user;
    await loadProgress(user.id);
    renderHome();
    go('s-home');
  } else {
    go('s-auth');
  }
}

init();
</script>
